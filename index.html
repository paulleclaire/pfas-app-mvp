<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFAS Calculator</title>
<style>
body{
  font-family: system-ui, Arial, sans-serif;
  margin: 2rem;
  max-width: 600px;
}
h1{margin-bottom:1rem;font-size:1.6rem}
label{display:block;margin-top:1rem}
.row{display:flex;align-items:center;gap:0.75rem;flex-wrap:nowrap}
input{
  padding:0.5rem;
  width:120px;
  font-size:1rem;
  -webkit-appearance: none;
  appearance: none;
}
select{padding:0.5rem;font-size:1rem}
button{
  padding:0.6rem 1rem;
  font-size:1rem;
  margin-top:1rem;
}
.unit-btn{
  padding:0.4rem 0.8rem;
  border:1px solid #000;
  cursor:pointer;
  background:#f2f2f2;
}
.unit-btn.active{background:#000;color:#fff}
.result-box{
  margin-top:2rem;
  padding:1rem;
  border:1px solid #000;
}
</style>
</head>

<body>
<h1>PFAS Exposure Calculator</h1>

<label>Adult or Child</label>
<select id="ageType">
  <option value="adult">Adult</option>
  <option value="child">Child</option>
</select>

<label>Weight</label>
<div class="row">
  <input id="weight" type="number" step="0.1" value="70">
  <div class="unit-btn active" id="kgBtn">kg</div>
  <div class="unit-btn" id="lbBtn">lb</div>
</div>

<label>PFAS in water (ng/L)</label>
<input id="pfas" type="number" step="0.1" value="51">

<button onclick="calc()">Calculate</button>

<div id="results" class="result-box" style="display:none"></div>

<script>
let unit = "kg";
document.getElementById("kgBtn").onclick = ()=>{unit="kg";kgBtn.classList.add("active");lbBtn.classList.remove("active");};
document.getElementById("lbBtn").onclick = ()=>{unit="lb";lbBtn.classList.add("active");kgBtn.classList.remove("active");};

function calc(){
  const ageType = document.getElementById("ageType").value;
  let w = parseFloat(document.getElementById("weight").value);
  const pfas = parseFloat(document.getElementById("pfas").value);

  if(unit==="lb"){ w = w * 0.453592; }

  const mlPerKg = ageType==="adult" ? 30 : 35;
  const dailyWaterLitres = (w * mlPerKg) / 1000;

  const pfasIntakeNg = dailyWaterLitres * pfas;

  const twi = 4.4;
  const weeklyAllow = w * twi;
  const dailyAllow = weeklyAllow / 7;

  const percentOver = (pfasIntakeNg / dailyAllow) * 100;

  const shortfall = dailyAllow - pfasIntakeNg;

  const r = document.getElementById("results");
  r.style.display="block";
  r.innerHTML =
    "Daily hydration need: " + dailyWaterLitres.toFixed(2) + " L<br>" +
    "PFAS intake from water: " + pfasIntakeNg.toFixed(1) + " ng/day<br>" +
    "Daily EFSA allowance: " + dailyAllow.toFixed(1) + " ng<br>" +
    "Shortfall vs allowance: " + shortfall.toFixed(1) + " ng<br>" +
    "% over EFSA limit if fully hydrated: " + percentOver.toFixed(0) + "%";
}
</script>

</body>
</html>
